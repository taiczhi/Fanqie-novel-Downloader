name: Download Novels

on:
  workflow_dispatch:
    inputs:
      book_ids:
        description: "书籍 ID 列表（逗号或空格分隔）"
        required: true
        type: string
      file_format:
        description: "输出格式"
        required: true
        type: choice
        options:
          - txt
          - epub
        default: "txt"
      save_path:
        description: "保存路径（相对于项目根目录）"
        required: false
        type: string
        default: "downloads"
      concurrent:
        description: "并发下载数量（1-5）"
        required: false
        type: number
        default: 3
        # 新增：限制并发数范围，避免输入无效值
        minimum: 1
        maximum: 5

permissions:
  contents: read
  # 新增：添加写入权限，避免Artifact上传失败
  actions: write
  artifacts: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  download:
    runs-on: ubuntu-latest
    name: Download Novels
    # 新增：允许失败后继续（可选，新手可先开启）
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt
          # 新增：确保Python环境完整
          check-latest: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libheif1 libheif-dev
          # 新增：安装常见的中文编码/依赖，避免下载小说时编码错误
          sudo apt-get install -y locales
          sudo locale-gen zh_CN.UTF-8
          export LC_ALL=zh_CN.UTF-8

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # 新增：添加容错，requirements.txt不存在时不报错
          if [ -f "config/requirements.txt" ]; then
            python -m pip install --prefer-binary -r config/requirements.txt
          else
            echo "⚠️ config/requirements.txt 不存在，跳过依赖安装"
          fi

      - name: Parse book IDs
        id: parse_ids
        shell: python
        env:
          RAW_IDS: ${{ github.event.inputs.book_ids }}
        run: |
          import os, re
          raw = os.environ["RAW_IDS"]
          ids = re.split(r"[,\s]+", raw.strip())
          ids = [i for i in ids if i and i.isdigit()]  # 新增：过滤非数字ID
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"book_ids={' '.join(ids)}\n")
              f.write(f"count={len(ids)}\n")
          if len(ids) == 0:
              print("❌ 未解析到有效的书籍ID！")
              exit(1)  # 无有效ID时终止流程
          print(f"✅ 解析到 {len(ids)} 个有效书籍ID: {' '.join(ids)}")

      - name: Create save directory
        # 新增：提前创建目录，避免下载时目录不存在报错
        run: |
          mkdir -p "${{ github.event.inputs.save_path }}"
          echo "📁 已创建保存目录: ${{ github.event.inputs.save_path }}"

      - name: Download novels
        id: download
        # 新增：超时控制，避免无限等待
        timeout-minutes: 30
        run: |
          python core/cli.py batch-download \
            ${{ steps.parse_ids.outputs.book_ids }} \
            --path "${{ github.event.inputs.save_path }}" \
            --format "${{ github.event.inputs.file_format }}" \
            --concurrent ${{ github.event.inputs.concurrent }} \
            && echo "status=success" >> "$GITHUB_OUTPUT" \
            || echo "status=partial" >> "$GITHUB_OUTPUT"
          # 新增：打印下载目录文件列表，方便排查
          echo "📄 下载目录文件列表："
          ls -l "${{ github.event.inputs.save_path }}" || echo "目录为空"

      - name: Collect stats
        id: stats
        # 新增：即使下载失败也执行统计
        if: always()
        run: |
          SAVE_PATH="${{ github.event.inputs.save_path }}"
          FORMAT="${{ github.event.inputs.file_format }}"

          if [ -d "$SAVE_PATH" ]; then
            FILE_COUNT=$(find "$SAVE_PATH" -type f -name "*.${FORMAT}" | wc -l)
            TOTAL_SIZE=$(du -sh "$SAVE_PATH" 2>/dev/null | cut -f1 || echo "0")
            echo "file_count=${FILE_COUNT}" >> "$GITHUB_OUTPUT"
            echo "total_size=${TOTAL_SIZE}" >> "$GITHUB_OUTPUT"
            echo "📊 统计结果：成功下载 ${FILE_COUNT} 个文件，总大小 ${TOTAL_SIZE}"
          else
            echo "file_count=0" >> "$GITHUB_OUTPUT"
            echo "total_size=0" >> "$GITHUB_OUTPUT"
            echo "📊 统计结果：无有效文件"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.stats.outputs.file_count > 0
        with:
          name: novels-${{ github.event.inputs.file_format }}-${{ github.run_number }}
          path: ${{ github.event.inputs.save_path }}/**/*.${{ github.event.inputs.file_format }}
          retention-days: 30
          if-no-files-found: warn
          # 新增：设置压缩级别，加快下载
          compression-level: 6

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'HEADER'
          ## 小说下载报告

          ### 下载配置
          | 项目 | 值 |
          | :--- | :--- |
          HEADER

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          | 书籍数量（解析后） | ${{ steps.parse_ids.outputs.count }} |
          | 输出格式 | \`${{ github.event.inputs.file_format }}\` |
          | 并发数 | ${{ github.event.inputs.concurrent }} |
          | 保存路径 | \`${{ github.event.inputs.save_path }}\` |

          ### 下载结果
          | 项目 | 值 |
          | :--- | :--- |
          | 成功文件 | ${{ steps.stats.outputs.file_count }} |
          | 总大小 | ${{ steps.stats.outputs.total_size }} |
          EOF

          # 新增：Artifact 链接仅在有文件时显示
          if [ "${{ steps.stats.outputs.file_count }}" -gt 0 ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<'GUIDE'
          | Artifact | \`novels-${{ github.event.inputs.file_format }}-${{ github.run_number }}\` |

          ### 如何下载
          1. 进入本次运行的 **Summary** 页面
          2. 在页面底部找到 **Artifacts** 区域
          3. 点击对应 Artifact 下载压缩包
          4. 解压后即可获得所有下载的小说文件

          > Artifact 将保留 30 天
          GUIDE
          else
            cat >> "$GITHUB_STEP_SUMMARY" <<'FAIL'

          ### 下载失败
          没有成功下载任何文件，请检查:
          - 书籍 ID 是否为纯数字且有效
          - core/cli.py 脚本是否能正常运行
          - config/requirements.txt 依赖是否安装完整
          - 查看上方「Download novels」步骤的日志了解详细错误
          FAIL
            # 新增：无文件时返回错误码，但不影响Summary展示
            exit 0
          fi
